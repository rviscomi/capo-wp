name: Release Capo for WordPress

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: npm ci

      - name: Run cross-language parity test
        run: node scripts/test-parity.mjs

      - name: Run PHP test suite
        run: |
          php tests/test-rules.php
          php tests/test-validator.php
          php tests/test-parser.php

      - name: Build release archive
        run: npm run package

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/capo.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Setup Subversion
        uses: ampscm/setup-subversion@v1

      - name: Deploy to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          fi
          echo "Deploying version $VERSION to WordPress.org SVN..."

          # Checkout SVN repository structure
          svn checkout https://plugins.svn.wordpress.org/capo-head-optimizer svn-repo --depth immediacy --non-interactive --trust-server-cert
          cd svn-repo
          svn update trunk --set-depth infinity
          svn update tags --set-depth empty

          # Sync packaged files into trunk
          unzip -q -o ../dist/capo.zip -d /tmp/unzipped
          rm -rf trunk/*
          cp -r /tmp/unzipped/capo/* trunk/
          svn add --force trunk/* || true

          # Create the version tag in SVN if it doesn't already exist
          if ! svn info "https://plugins.svn.wordpress.org/capo-head-optimizer/tags/$VERSION" --non-interactive --trust-server-cert >/dev/null 2>&1; then
            svn copy trunk "tags/$VERSION"
          fi

          # Commit to SVN
          svn status
          svn commit -m "Tag version $VERSION" --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache --non-interactive


