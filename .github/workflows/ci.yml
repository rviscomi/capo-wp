name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: npm ci

      - name: Verify rule synchronization
        run: |
          npm run sync-rules
          git diff --exit-code includes/class-capo-rules.php

      - name: Run cross-language parity test
        run: node scripts/test-parity.mjs

      - name: Run PHP test suite
        run: |
          php tests/test-rules.php
          php tests/test-validator.php
          php tests/test-parser.php

      - name: Verify packaging
        run: npm run package
