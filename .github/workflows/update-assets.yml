name: Update WordPress.org Assets

on:
  push:
    branches:
      - main
    paths:
      - '.wordpress-org/**'
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends subversion

      - name: Deploy assets to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          svn checkout https://plugins.svn.wordpress.org/capo-head-optimizer/assets svn-assets --non-interactive --trust-server-cert
          rsync -av --delete --exclude='.svn' .wordpress-org/ svn-assets/
          cd svn-assets
          svn add --force * || true
          svn status | grep '^\!' | awk '{print $2}' | xargs -r svn delete || true
          svn status
          svn commit -m "Update WordPress.org directory assets" --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache --non-interactive

